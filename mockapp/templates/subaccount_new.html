{% extends "_base.html" %}
{% block title %}Open Sub-Account{% endblock %}
{% block banner %}SHARE MAINTENANCE — OPEN SUB-ACCOUNT{% endblock %}
{% block content %}

{% if error %}
<table cellpadding="4" cellspacing="0" style="border:1px solid #990000; background:#fff4f4; margin-bottom:10px">
  <tr><td class="c4" role="alert">{{ error }}</td></tr>
</table>
{% endif %}

<form method="post" action="{{ base }}/subaccount/review" name="frmNewSub">
<table class="tbl1" cellpadding="3" cellspacing="0">
  <tr><td class="c1" colspan="2">New Sub-Account</td></tr>
  <tr>
    <td class="c2" width="150" nowrap>Member #:</td>
    <td class="c3"><input type="text" name="txtMbrNo" size="14" maxlength="10" value="{{ member_no|default('', true) }}"></td>
  </tr>
  <tr>
    <td class="c2" nowrap>Sub-Account Type:</td>
    <td class="c3">
      <select name="selType">
        <option value="">— Select —</option>
        {% for code, label in types %}
        <option value="{{ code }}">{{ code }} - {{ label }}</option>
        {% endfor %}
      </select>
    </td>
  </tr>
  <tr>
    <td class="c2" nowrap>Nickname:</td>
    <td class="c3"><input type="text" name="txtNickname" size="24" maxlength="30"></td>
  </tr>
</table>
<p><input type="submit" name="btnNext" value="Continue"></p>
</form>
{% endblock %}
