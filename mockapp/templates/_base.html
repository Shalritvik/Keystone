<!DOCTYPE html>
<html>
<head>
<title>{{ cfg.short }} Member Services — {% block title %}{% endblock %}</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<style type="text/css">
/* Class names are deliberately meaningless. Legacy enterprise apps do not
   hand automation stable hooks; targeting must come from rendered meaning. */
body { font-family: Verdana, Arial, sans-serif; font-size: 11px; background: #d4d0c8; margin: 0; padding: 0; }
td { font-family: Verdana, Arial, sans-serif; font-size: 11px; }
.c1 { background: {{ cfg.accent }}; color: #ffffff; font-weight: bold; padding: 4px 8px; }
.c2 { background: #ece9d8; padding: 3px 6px; }
.c3 { background: #ffffff; padding: 3px 6px; }
.c4 { color: #990000; font-weight: bold; }
.c5 { background: #f5f3e7; border: 1px solid #a0a0a0; }
.tbl1 { border-collapse: collapse; border: 2px solid #808080; }
.tbl1 td { border: 1px solid #b0b0b0; }
.tbl2 { border-collapse: collapse; }
input, select { font-family: Verdana, Arial, sans-serif; font-size: 11px; border: 1px solid #7f9db9; }
input[type=submit], input[type=button] { background: #ece9d8; border: 2px outset #ffffff; padding: 1px 10px; }
a { color: {{ cfg.accent }}; }
.ovl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; opacity: 0.55; z-index: 900; }
.mdl { position: fixed; top: 80px; left: 50%; margin-left: -210px; width: 400px; background: #ffffff;
       border: 3px outset #cccccc; z-index: 901; padding: 0; }
</style>
</head>
<body>
{% if interstitial %}
<div class="ovl"></div>
<div class="mdl" role="dialog" aria-label="System Message">
  <table width="100%" cellpadding="0" cellspacing="0"><tr><td class="c1">System Message</td></tr></table>
  <div style="padding:14px">
    <p>Scheduled host maintenance will occur Sunday 02:00&ndash;04:00 ET.
       Member servicing will be unavailable during this window.</p>
    <p align="right">
      <input type="button" value="Continue" onclick="this.parentNode.parentNode.parentNode.style.display='none';document.getElementsByClassName('ovl')[0].style.display='none';">
    </p>
  </div>
</div>
{% endif %}
<table width="100%" cellpadding="0" cellspacing="0"><tr><td class="c1">{% block banner %}{% endblock %}</td></tr></table>
<div style="padding:10px">
{% block content %}{% endblock %}
</div>
</body>
</html>
