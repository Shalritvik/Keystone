{% extends "_base.html" %}
{% block title %}Posted{% endblock %}
{% block banner %}SHARE MAINTENANCE — POSTED{% endblock %}
{% block content %}
<table class="tbl1" cellpadding="3" cellspacing="0" width="480">
  <tr><td class="c1" colspan="2">Transaction Complete</td></tr>
  <tr><td class="c2" width="150" nowrap>Status:</td><td class="c3"><b role="status">SUB-ACCOUNT OPENED</b></td></tr>
  <tr><td class="c2" nowrap>New Account #:</td><td class="c3">{{ new_number }}</td></tr>
  <tr><td class="c2" nowrap>Type:</td><td class="c3">{{ type_label }}</td></tr>
</table>
<p style="margin-top:12px"><a href="{{ base }}/lookup">Return to Lookup</a></p>
{% endblock %}
